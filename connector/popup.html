<!doctype html><html><head><meta charset="utf-8"><style>body{width:300px;padding:20px;font:14px system-ui;background:#f8faf9;color:#1e2b27}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd9d2;border-radius:10px;margin:8px 0}button{background:#235d46;color:white;font-weight:600}p{line-height:1.6}</style></head><body><h2>Connect to Still</h2><p>First open your signed-in Instagram tab, then open this extension from that tab. Copy the pairing code from the local app → Settings and paste it here. This sends your Instagram session only to this Mac’s localhost server. It is kept in memory until you disconnect or restart.</p><label for="code">Pairing code</label><input id="code" autocomplete="off"><button id="connect">Connect existing session</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
